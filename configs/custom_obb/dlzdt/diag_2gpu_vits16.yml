__include__:
  - ./sp_fz_common.yml

# ============================================================================
# 双卡训练诊断配置（多卡进度漂移/超时中断复现用）
# ----------------------------------------------------------------------------
# 模型结构 ← configs/app/presets/deimv2_dinov3_vits16_freeze_obb.yml
#            （ResAtten + dinov3_vits16 冻结主干，224/32 紧凑维度，训练快）
# 数据/训练参数 ← sp_fz_common.yml（dlzdt 电缆终端头 OBB 数据集全套继承：
#            路径、batch、scheduler、loss/matcher、增强管线、cache_images=disk）
# 仅覆盖：模型段（224 系通道匹配）与输出目录。
#
# 复现命令见 scripts/diag_2gpu.sh（含环境快照与 NCCL flight recorder）。
# ============================================================================

output_dir: ./outputs/diag_2gpu_vits16

DEIM:
  backbone: DINOv3STAsResAtten

DINOv3STAsResAtten:
  name: dinov3_vits16
  weights_path: ./ckpts/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
  interaction_indexes: []
  finetune: False
  conv_inplane: 32
  hidden_dim: 224
  adapter_type: 'sta'

HybridEncoder:
  in_channels: [224, 224, 224]
  feat_strides: [8, 16, 32]
  hidden_dim: 224
  dim_feedforward: 896

DEIMTransformer:
  feat_channels: [224, 224, 224]
  feat_strides: [8, 16, 32]
  hidden_dim: 224
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  dim_feedforward: 1792
  box_mode: obb
  angle_rep: 0


# ---- 训练数据 ----
# 数据集: 电缆终端头 OBB 检测，YOLO-OBB 格式
# 数据增强策略（3 阶段增强强度）:
#   epoch [0, 30)            : 弱增强
#   epoch [30, 60)           : 强增强（mosaic 概率 0.5 + 全部 ops 启用）
#   epoch [60, 150)          : 弱增强
#   epoch [150, 300-60=240)  : 弱增强
#   epoch [240, 300)         : 无增强（no_aug_epoch=60）
# collate_fn 额外增强:
#   - Mixup: epoch [30, 60] 间以 0.5 概率混合两张图
#   - CopyBlend: epoch [30, 150] 间以 0.5 概率复制小目标到当前图
#   - 多尺度训练: base_size_repeat=4 → 4 种尺度重复采样

train_dataloader:
  total_batch_size: 4   # 总 batch size（= GPU 数 * per-GPU batch size）
  num_workers: 2
  dataset:
    type: DotaDataset
    cache_images: disk
    cache_ram: 0
    img_folder: /mnt/disk8t/lyj_dir/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/images/train
    ann_folder: /mnt/disk8t/lyj_dir/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/labels/train
    classes_file: /mnt/disk8t/lyj_dir/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/classes.txt
    format: 'YOLO-OBB'
    transforms:
      ops:
        # Mosaic: 4 图拼接，output_size=320（小于训练尺寸 640，拼接后 resize 放大）
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 60, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}   # 随机色彩扰动
        - {type: OBBZoomOut, fill: 0}                 # 随机缩放（zoom-out，填充背景）
        - {type: OBBIoUCrop, p: 0.8}                  # 基于 IoU 的随机裁剪
        - {type: OBBSanitize, min_size: 1}            # 清理过小/无效标注
        - {type: OBBFlip}                              # 随机水平+垂直翻转
        - {type: OBBResize, size: [640, 640]}          # 统一缩放到训练尺寸
        - {type: OBBSanitize, min_size: 1}            # resize 后再次清理
        - {type: ConvertPILImage, dtype: 'float32', scale: True}  # 转 float32 并归一化到 [0,1]
        - {type: OBBConvertBoxes, normalize: True, img_size: [640, 640]}  # OBB 坐标归一化到 [0,1]
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}  # ImageNet 标准化
      policy:
        epoch: [10, 30, 50]   # 增强强度切换 epoch（弱→强→弱→无）
        ops: ['Mosaic', 'RandomPhotometricDistort', 'OBBZoomOut', 'OBBIoUCrop']
      mosaic_prob: 0.5         # Mosaic 启用概率（与 policy 联动）
  collate_fn:
    base_size: 640
    # Mixup 配置
    mixup_prob: 0.5
    mixup_epochs: [30, 50]     # Mixup 活跃 epoch 区间
    stop_epoch: 50            # 多尺度训练截止 epoch
    # CopyBlend 配置（复制小目标增强）
    copyblend_prob: 0.5
    copyblend_epochs: [30, 50]
    area_threshold: 100        # 仅复制面积 < 100 的小目标
    num_objects: 3             # 每次复制 3 个目标
    with_expand: True
    expand_ratios: [0.1, 0.25]
    # EMA 与多尺度
    ema_restart_decay: 0.9999  # 增强策略切换时 EMA 重启衰减率
    base_size_repeat: 4        # 多尺度重复次数（4 种尺度）

# ---- 验证数据 ----
val_dataloader:
  total_batch_size: 2
  num_workers: 2
  dataset:
    img_folder: /mnt/disk8t/lyj_dir/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/images/val
    ann_folder: /mnt/disk8t/lyj_dir/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/labels/val
    classes_file: /mnt/disk8t/lyj_dir/train_dataset/ShiGongYanShou/电缆终端头_数据集(2026_5_31_obb)/classes.txt
    format: 'YOLO-OBB'
    transforms:
      ops:
        - {type: OBBResize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: OBBConvertBoxes, normalize: True, img_size: [640, 640]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

